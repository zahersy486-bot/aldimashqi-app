name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ccache libffi-dev libssl-dev unzip tar wget zip
        pip install --upgrade pip
        pip install --upgrade buildozer "cython<3.0.0"

    - name: Build APK Direct
      run: |
        export BUILDOZER_ACCEPT_SDK_LICENSES=1
        export BUILDOZER_ALLOW_KIVY_BUILD_AS_ROOT=1
        
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AlDimashqi-APK
        path: bin/*.apk
